</head>
<body>
<div id="root"></div>
<script type="text/babel">
var useState = React.useState;
var useEffect = React.useEffect;
var useRef = React.useRef;

var SB = "https://jcbmlbuqbhpnixylngzw.supabase.co";
var KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpjYm1sYnVxYmhwbml4eWxuZ3p3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA0MjkwNzQsImV4cCI6MjA5NjAwNTA3NH0.Q5Sdj-a9k1UxENLJhCj8_PNBShMx1AuQSSwFazme8pA";
var SHIP = 15;
var PASS = "shadyrae";
var CATS = ["All","Women's Clothing","Men's Clothing","Kids Clothing","Baby Clothing","Baby Items","Crafts & Hobbies","Home & Decor","Electronics","Books & Media","Toys","Vintage","Other"];
var CLOTH = ["Women's Clothing","Men's Clothing","Kids Clothing","Baby Clothing"];

function fmt(n) { return "$" + Number(n).toFixed(2); }
function px(x) { return x != null ? x : 0; }
function getPrice(i) { return i.hagglePrice != null ? i.hagglePrice : i.price; }

var H = {apikey: KEY, Authorization: "Bearer " + KEY};
var HJ = {apikey: KEY, Authorization: "Bearer " + KEY, "Content-Type": "application/json", Prefer: "return=representation"};

function dbGet(t) {
  return fetch(SB + "/rest/v1/" + t + "?order=created_at.desc", {headers: H}).then(function(r){return r.json();});
}
function dbIns(t, d) {
  return fetch(SB + "/rest/v1/" + t, {method:"POST",headers:HJ,body:JSON.stringify(d)}).then(function(r){return r.json();});
}
function dbUpd(t, id, d) {
  return fetch(SB + "/rest/v1/" + t + "?id=eq." + id, {method:"PATCH",headers:HJ,body:JSON.stringify(d)}).then(function(r){return r.json();});
}
function dbDel(t, id) {
  return fetch(SB + "/rest/v1/" + t + "?id=eq." + id, {method:"DELETE",headers:H});
}
function uploadImg(file) {
  var ext = file.name.split(".").pop();
  var name = Date.now() + "-" + Math.random().toString(36).substr(2,5) + "." + ext;
  return fetch(SB + "/storage/v1/object/items/" + name, {
    method:"POST",
    headers:{apikey:KEY,Authorization:"Bearer "+KEY,"Content-Type":file.type},
    body:file
  }).then(function(r) {
    if (!r.ok) throw new Error("fail");
    return SB + "/storage/v1/object/public/items/" + name;
  });
}

function calcTotal(cart, deals) {
  var total = 0;
  var used = {};
  deals.forEach(function(deal) {
    if (!deal.active || !Array.isArray(deal.item_ids)) return;
    var el = cart.filter(function(i) { return deal.item_ids.indexOf(i.id) > -1 && !used[i.id]; });
    if (deal.deal_type === "qty_price" && el.length >= deal.quantity) {
      var g = Math.floor(el.length / deal.quantity);
      total += g * deal.price;
      el.slice(0, g * deal.quantity).forEach(function(i) { used[i.id] = true; });
      el.slice(g * deal.quantity).forEach(function(i) { total += getPrice(i); used[i.id] = true; });
    } else if (deal.deal_type === "buy_get_free" && el.length >= deal.quantity) {
      var sorted = el.slice().sort(function(a,b){ return getPrice(a)-getPrice(b); });
      var free = Math.floor(el.length / (deal.quantity + 1));
      sorted.slice(0, free).forEach(function(i) { used[i.id] = true; });
      sorted.slice(free).forEach(function(i) { total += getPrice(i); used[i.id] = true; });
    }
  });
  cart.forEach(function(i) { if (!used[i.id]) total += getPrice(i); });
  return total;
}

var IS = {width:"100%",padding:"11px 13px",border:"2px solid #ede8e0",borderRadius:8,fontSize:14,fontFamily:"inherit",outline:"none",boxSizing:"border-box",background:"#fff"};
var DS = {width:"100%",padding:"11px 13px",border:"1px solid #555",borderRadius:8,fontSize:14,fontFamily:"inherit",outline:"none",boxSizing:"border-box",background:"#3a3a3a",color:"#fff"};

function Fld(props) {
  return (
    <div style={{marginBottom:12}}>
      <label style={{display:"block",fontSize:12,color:props.dark?"#aaa":"#888",marginBottom:5}}>{props.label}</label>
      {props.children}
    </div>
  );
}

function Sec(props) {
  return (
    <div style={{background:"#fff",borderRadius:12,padding:18,marginBottom:14,border:"1px solid #ede8e0"}}>
      <div style={{fontSize:11,fontWeight:"bold",textTransform:"uppercase",letterSpacing:1.5,color:"#b89a5a",marginBottom:12}}>{props.title}</div>
      {props.children}
    </div>
  );
}

function ImgUp(props) {
  var state = useState(null);
  var preview = state[0]; var setPreview = state[1];
  var bstate = useState(false);
  var busy = bstate[0]; var setBusy = bstate[1];
  var ref = useRef();
  function go(e) {
    var f = e.target.files[0];
    if (!f) return;
    setBusy(true);
    setPreview(URL.createObjectURL(f));
    uploadImg(f).then(function(url) {
      props.onDone(url);
      setBusy(false);
    }).catch(function() {
      setPreview(null);
      setBusy(false);
    });
  }
  return (
    <div>
      <input ref={ref} type="file" accept="image/*" onChange={go} style={{display:"none"}}/>
      {preview
        ? <div>
            <img src={preview} style={{width:"100%",maxHeight:180,objectFit:"cover",borderRadius:8,marginBottom:8}}/>
            <button onClick={function(){ref.current.click();}} style={{width:"100%",background:"#3a3a3a",border:"none",borderRadius:6,padding:8,color:"#aaa",cursor:"pointer",fontSize:12,fontFamily:"inherit"}}>Change Photo</button>
          </div>
        : <button onClick={function(){ref.current.click();}} style={{width:"100%",background:props.dark?"#3a3a3a":"#f5f0e8",border:"2px dashed "+(props.dark?"#666":"#c0a070"),borderRadius:8,padding:"22px 14px",cursor:"pointer",fontFamily:"inherit",color:props.dark?"#f0c060":"#c0854a",textAlign:"center"}}>
            {busy ? <span>Uploading...</span> : <div><div style={{fontSize:30,marginBottom:6}}>📷</div><div style={{fontWeight:"bold",fontSize:14}}>Tap to add photo</div><div style={{fontSize:11,opacity:0.7,marginTop:3}}>Camera or gallery</div></div>}
          </button>}
    </div>
  );
}

function Ann(props) {
  var active = props.anns.filter(function(a) { return a.active && a.message; });
  if (!active.length) return null;
  return (

        return <div key={a.id} style={{maxWidth:1100,margin:"0 auto",display:"flex",gap:10,alignItems:"center"}}>
          <span style={{fontSize:16}}>📢</span>
          <span style={{fontSize:13,fontWeight:"bold",color:"#2c2c2c"}}>{a.message}</span>
        </div>;
      })}
    </div>
  );
}

function DealBadge(props) {
  var d = props.deals.find(function(x) { return x.active && Array.isArray(x.item_ids) && x.item_ids.indexOf(props.id) > -1; });

  return <div style={{background:"#e85",color:"#fff",fontSize:10,padding:"3px 8px",borderRadius:10,display:"inline-block",marginTop:4}}>🏷️ {lbl}</div>;
}

function ConfirmPage(props) {

    paypal: "Send PayPal to @shadyrae with your order number in the note.",

        <div style={{fontSize:56,marginBottom:10}}>🎉</div>
        <div style={{fontSize:22,fontWeight:"bold",color:"#2c2c2c",marginBottom:6}}>Order placed!</div>

function CartPage(props) {
  var total = calcTotal(props.cart, props.deals);
  var orig = props.cart.reduce(function(s,i){return s+getPrice(i);},0);
  var saved = orig - total;
  return (
    <div style={{minHeight:"100vh",background:"#faf7f2"}}>
      <div style={{background:"#2c2c2c",padding:"13px 18px",display:"flex",alignItems:"center",gap:14,position:"sticky",top:0,zIndex:100}}>
        <button onClick={props.onBack} style={{background:"none",border:"none",color:"#f0c060",cursor:"pointer",fontSize:14}}>Back to Shop</button>
        <div style={{color:"#fff",fontWeight:"bold"}}>Your Cart</div>
      </div>
      <div style={{maxWidth:660,margin:"0 auto",padding:"24px 16px"}}>
        {props.cart.length === 0
          ? <div style={{textAlign:"center",padding:60,color:"#aaa"}}><div style={{fontSize:48}}>🛒</div><div style={{marginTop:12}}>Cart is empty</div></div>
          : <div>
              {props.cart.map(function(i) {
                var d = props.deals.find(function(x){ return x.active && Array.isArray(x.item_ids) && x.item_ids.indexOf(i.id)>-1; });
                return (
                  <div key={i.id} style={{background:"#fff",borderRadius:12,padding:14,marginBottom:10,display:"flex",gap:14,alignItems:"center",border:"1px solid #ede8e0"}}>
                    <img src={i.image||"https://placehold.co/80"} style={{width:68,height:68,objectFit:"cover",borderRadius:8}}/>
                    <div style={{flex:1}}>
                      <div style={{fontWeight:"bold",fontSize:14}}>{i.title}</div>
                      {d && <div style={{fontSize:11,color:"#e85"}}>🏷️ {d.title}</div>}
                      {i.hagglePrice != null && <div style={{fontSize:11,color:"#5a8a5a"}}>Haggle price applied</div>}
                    </div>
                    <div style={{fontWeight:"bold",color:"#c0854a"}}>{fmt(getPrice(i))}</div>
                    <button onClick={function(){props.rm(i.id);}} style={{background:"none",border:"none",color:"#ccc",cursor:"pointer",fontSize:18}}>x</button>
                  </div>
                );
              })}
              <div style={{background:"#fff",borderRadius:12,padding:18,marginTop:14,border:"1px solid #ede8e0"}}>
                {saved > 0 && <div style={{background:"#edfaf0",border:"1px solid #5a8a5a",borderRadius:8,padding:"10px 14px",marginBottom:12,fontSize:13,color:"#3a6a3a",fontWeight:"bold"}}>You are saving {fmt(saved)} with deals!</div>}
                <div style={{display:"flex",justifyContent:"space-between",fontSize:14,marginBottom:4}}><span>Total</span><span style={{fontWeight:"bold",color:"#c0854a"}}>{fmt(total)}</span></div>
                <div style={{fontSize:11,color:"#aaa",marginBottom:14}}>+ Shipping at checkout</div>
                <button onClick={props.onChk} style={{width:"100%",background:"#2c2c2c",color:"#f0c060",border:"none",borderRadius:8,padding:13,fontSize:15,fontWeight:"bold",cursor:"pointer",fontFamily:"inherit"}}>Proceed to Checkout</button>
              </div>
            </div>}
      </div>
    </div>
  );
}

function CheckoutPage(props) {
  var bs = useState(false); var busy = bs[0]; var setBusy = bs[1];
  function set(k,v) { props.setForm(function(f){var n={};Object.keys(f).forEach(function(x){n[x]=f[x];}); n[k]=v; return n;}); }
  var total = calcTotal(props.cart, props.deals);
  var ship = props.form.delivery === "mail" ? SHIP : 0;
  var grand = total + ship;
  var orig = props.cart.reduce(function(s,i){return s+getPrice(i);},0);
  var saved = orig - total;
  var ok = props.form.name && props.form.email && (props.form.delivery !== "mail" || props.form.address);
  function go() { setBusy(true); props.onSubmit(grand).then(function(){setBusy(false);}); }
  return (
    <div style={{minHeight:"100vh",background:"#faf7f2"}}>
      <div style={{background:"#2c2c2c",padding:"13px 18px",display:"flex",alignItems:"center",gap:14,position:"sticky",top:0,zIndex:100}}>
        <button onClick={props.onBack} style={{background:"none",border:"none",color:"#f0c060",cursor:"pointer",fontSize:14}}>Back</button>
        <div style={{color:"#fff",fontWeight:"bold"}}>Checkout</div>

      <div style={{maxWidth:560,margin:"0 auto",padding:"24px 16px"}}>
        <Sec title="Your Info">
          <Fld label="Name *"><input value={props.form.name} onChange={function(e){set("name",e.target.value);}} placeholder="Full name" style={IS}/></Fld>
          <Fld label="Email *"><input value={props.form.email} onChange={function(e){set("email",e.target.value);}} type="email" placeholder="you@email.com" style={IS}/></Fld>
          <Fld label="Phone"><input value={props.form.phone} onChange={function(e){set("phone",e.target.value);}} placeholder="optional" style={IS}/></Fld>
        </Sec>
        <Sec title="Delivery">
          <label style={{display:"flex",alignItems:"center",gap:10,padding:"12px 14px",background:props.form.delivery==="pickup"?"#fdf4e3":"#fff",border:"2px solid "+(props.form.delivery==="pickup"?"#f0c060":"#ede8e0"),borderRadius:8,cursor:"pointer",marginBottom:8}}>
            <input type="radio" name="del" checked={props.form.delivery==="pickup"} onChange={function(){set("delivery","pickup");}} style={{accentColor:"#c0854a"}}/>
            <span style={{fontWeight:"bold",fontSize:14}}>Local Pickup — Kelowna, BC</span>
          </label>
          <label style={{display:"flex",alignItems:"center",gap:10,padding:"12px 14px",background:props.form.delivery==="mail"?"#fdf4e3":"#fff",border:"2px solid "+(props.form.delivery==="mail"?"#f0c060":"#ede8e0"),borderRadius:8,cursor:"pointer",marginBottom:8}}>
            <input type="radio" name="del" checked={props.form.delivery==="mail"} onChange={function(){set("delivery","mail");}} style={{accentColor:"#c0854a"}}/>
            <span style={{fontWeight:"bold",fontSize:14}}>Ship to me (+${SHIP} CAD)</span>
          </label>
          {props.form.delivery==="mail" && <Fld label="Address *"><input value={props.form.address} onChange={function(e){set("address",e.target.value);}} placeholder="Street, City, Province, Postal" style={IS}/></Fld>}
        </Sec>
        <Sec title="Payment">
          {[["etransfer","E-Transfer"],["paypal","PayPal"],["cash","Cash (pickup only)"]].map(function(pair) {
            return (
              <label key={pair[0]} style={{display:"flex",alignItems:"center",gap:10,padding:"12px 14px",background:props.form.payment===pair[0]?"#fdf4e3":"#fff",border:"2px solid "+(props.form.payment===pair[0]?"#f0c060":"#ede8e0"),borderRadius:8,cursor:"pointer",marginBottom:8}}>
                <input type="radio" name="pay" checked={props.form.payment===pair[0]} onChange={function(){set("payment",pair[0]);}} style={{accentColor:"#c0854a"}}/>
                <span style={{fontWeight:"bold",fontSize:14}}>{pair[1]}</span>
              </label>
            );
          })}
        </Sec>
        <Sec title="Notes">
          <textarea value={props.form.note} onChange={function(e){set("note",e.target.value);}} placeholder="Anything for the seller?" rows={3} style={{width:"100%",padding:"11px 13px",border:"2px solid #ede8e0",borderRadius:8,fontSize:14,fontFamily:"inherit",outline:"none",boxSizing:"border-box",resize:"vertical"}}/>
        </Sec>
        <div style={{background:"#fff",borderRadius:12,padding:18,border:"1px solid #ede8e0",marginBottom:18}}>
          {props.cart.map(function(i){return <div key={i.id} style={{display:"flex",justifyContent:"space-between",fontSize:13,color:"#555",marginBottom:3}}><span>{i.title}</span><span>{fmt(getPrice(i))}</span></div>;})}
          <div style={{borderTop:"1px solid #ede8e0",marginTop:10,paddingTop:10}}>
            {saved>0 && <div style={{display:"flex",justifyContent:"space-between",fontSize:13,color:"#5a8a5a",fontWeight:"bold",marginBottom:3}}><span>Deal savings</span><span>-{fmt(saved)}</span></div>}
            <div style={{display:"flex",justifyContent:"space-between",fontSize:13,color:"#555",marginBottom:3}}><span>Subtotal</span><span>{fmt(total)}</span></div>
            <div style={{display:"flex",justifyContent:"space-between",fontSize:13,color:"#555",marginBottom:3}}><span>Shipping</span><span>{ship>0?fmt(ship):"Free"}</span></div>
            <div style={{display:"flex",justifyContent:"space-between",fontWeight:"bold",fontSize:16,color:"#c0854a",marginTop:8}}><span>Total</span><span>{fmt(grand)}</span></div>
          </div>
        </div>
        <button onClick={go} disabled={!ok||busy} style={{width:"100%",background:ok?"#2c2c2c":"#ccc",color:ok?"#f0c060":"#888",border:"none",borderRadius:8,padding:13,fontSize:15,fontWeight:"bold",cursor:ok?"pointer":"not-allowed",fontFamily:"inherit"}}>
          {busy ? "Placing order..." : "Place Order — " + fmt(grand)}
        </button>
        <div style={{fontSize:11,color:"#aaa",textAlign:"center",marginTop:10}}>No account needed.</div>
      </div>
    </div>
  );
}

function HagglePage(props) {
  var os = useState(""); var offer = os[0]; var setOffer = os[1];
  var ns = useState(""); var name = ns[0]; var setName = ns[1];
  var es = useState(""); var email = es[0]; var setEmail = es[1];
  var bs = useState(false); var busy = bs[0]; var setBusy = bs[1];
  var mine = props.haggles.filter(function(h){return h.item_id===props.item.id;});
  var pend = mine.find(function(h){return h.status==="pending";});
  var acc = mine.find(function(h){return h.status==="accepted";});
  var rej = !acc && !pend && mine.find(function(h){return h.status==="rejected";});
  function send() {
    var o = parseFloat(offer);
    if (isNaN(o)||o<=0||!name||!email) return;
    setBusy(true);
    dbIns("haggles",{item_id:props.item.id,item_title:props.item.title,asking_price:props.item.price,offer:o,buyer_name:name,buyer_email:email,status:"pending"}).then(function(){
      props.onRefresh().then(function(){setBusy(false);});
    });
  }
  return (
    <div style={{minHeight:"100vh",background:"#faf7f2",display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
      <div style={{background:"#fff",borderRadius:16,padding:32,maxWidth:420,width:"100%",boxShadow:"0 4px 24px rgba(0,0,0,0.1)"}}>
        <button onClick={props.onBack} style={{background:"none",border:"none",color:"#c0854a",cursor:"pointer",fontSize:13,marginBottom:18}}>Back</button>
        <div style={{fontSize:10,color:"#b89a5a",letterSpacing:2,textTransform:"uppercase",marginBottom:6}}>Make an Offer</div>
        <div style={{fontSize:20,fontWeight:"bold",marginBottom:4}}>{props.item.title}</div>
        <div style={{fontSize:15,color:"#888",marginBottom:22}}>Asking: <strong style={{color:"#c0854a"}}>{fmt(props.item.price)}</strong></div>
        {!pend && !acc && <div>
          <Fld label="Name *"><input value={name} onChange={function(e){setName(e.target.value);}} placeholder="Full name" style={IS}/></Fld>
          <Fld label="Email *"><input value={email} onChange={function(e){setEmail(e.target.value);}} type="email" placeholder="you@email.com" style={IS}/></Fld>
          <Fld label="Your offer ($)">
            <input type="number" value={offer} onChange={function(e){setOffer(e.target.value);}} placeholder="0.00" style={IS}/>
          </Fld>
          <div style={{fontSize:11,color:"#aaa",marginBottom:16}}>Refresh to check the sellers response!</div>
          <button onClick={send} disabled={busy||!offer||!name||!email} style={{width:"100%",background:(offer&&name&&email)?"#c0854a":"#ddd",color:(offer&&name&&email)?"#fff":"#aaa",border:"none",borderRadius:8,padding:13,fontSize:15,fontWeight:"bold",cursor:"pointer",fontFamily:"inherit"}}>
            {busy ? "Sending..." : "Send Offer"}
          </button>
        </div>}
        {pend && !acc && <div style={{background:"#fffbe6",border:"1px solid #f0c060",borderRadius:10,padding:20,textAlign:"center"}}>
          <div style={{fontSize:32,marginBottom:8}}>⏳</div>
          <div style={{fontWeight:"bold",color:"#887020"}}>Offer sent: {fmt(pend.offer)}</div>
          <div style={{fontSize:13,color:"#aaa",marginTop:6}}>Waiting on seller... refresh to check!</div>
        </div>}
        {acc && <div style={{background:"#edfaf0",border:"1px solid #5a8a5a",borderRadius:10,padding:20,textAlign:"center"}}>
          <div style={{fontSize:32,marginBottom:8}}>🎉</div>
          <div style={{fontWeight:"bold",color:"#3a6a3a",fontSize:16}}>Offer accepted!</div>
          <div style={{fontSize:14,color:"#555",margin:"8px 0"}}>New price: <strong style={{color:"#3a6a3a"}}>{fmt(acc.offer)}</strong></div>
          <button onClick={function(){props.onAddToCart(Object.assign({},props.item,{hagglePrice:acc.offer}));}} style={{width:"100%",background:"#3a6a3a",color:"#fff",border:"none",borderRadius:8,padding:13,fontSize:14,fontWeight:"bold",cursor:"pointer",fontFamily:"inherit",marginTop:10}}>Add to Cart at New Price</button>
        </div>}
        {rej && <div style={{background:"#fef2f2",border:"1px solid #e88",borderRadius:10,padding:20,textAlign:"center"}}>
          <div style={{fontSize:32,marginBottom:8}}>😔</div>
          <div style={{fontWeight:"bold",color:"#a03030"}}>Offer declined</div>
          <div style={{fontSize:13,color:"#888",margin:"8px 0"}}>You can still buy at {fmt(props.item.price)}.</div>
          <button onClick={props.onBack} style={{width:"100%",background:"#2c2c2c",color:"#f0c060",border:"none",borderRadius:8,padding:13,fontSize:14,fontWeight:"bold",cursor:"pointer",fontFamily:"inherit",marginTop:10}}>Go Back</button>
        </div>}
      </div>
    </div>
  );
}

function AdminPage(props) {

    setBusy(true);
    var p = props.anns.length > 0
      ? dbUpd("announcements", props.anns[0].id, {message:ann, active:!!ann})

    if (!ni.title || !ni.price) return;
    setBusy(true);
    var data = {title:ni.title,category:ni.category,price:parseFloat(ni.price),condition:ni.condition,description:ni.description,image:ni.image,sold:false};
    dbIns("items", data).then(function(){
      setNi({title:"",category:"Women's Clothing",price:"",condition:"Good",description:"",image:""});

function App() {
  var is = useState([]); var items = is[0]; var setItems = is[1];
  var hs = useState([]); var haggles = hs[0]; var setHaggles = hs[1];
  var ds = useState([]); var deals = ds[0]; var setDeals = ds[1];
  var ans = useState([]); var anns = ans[0]; var setAnns = ans[1];
  var ls = useState(true); var loading = ls[0]; var setLoading = ls[1];
  var cs = useState([]); var cart = cs[0]; var setCart = cs[1];
  var vs = useState("shop"); var view = vs[0]; var setView = vs[1];
  var sis = useState(null); var selItem = sis[0]; var setSelItem = sis[1];
  var his = useState(null); var hagItem = his[0]; var setHagItem = his[1];
  var cats = useState("All"); var cat = cats[0]; var setCat = cats[1];
  var qs = useState(""); var q = qs[0]; var setQ = qs[1];
  var adm = useState(false); var admin = adm[0]; var setAdmin = adm[1];
  var fs = useState({name:"",email:"",phone:"",delivery:"pickup",address:"",payment:"etransfer",note:""}); var form = fs[0]; var setForm = fs[1];
  var ors = useState("GS-"+Math.random().toString(36).substr(2,6).toUpperCase()); var orderRef = ors[0];
  var dones = useState(false); var done = dones[0]; var setDone = dones[1];
  var gs = useState(0); var grand = gs[0]; var setGrand = gs[1];

  function load() {
    setLoading(true);
    return Promise.all([dbGet("items"),dbGet("haggles"),dbGet("deals"),dbGet("announcements")]).then(function(results){
      setItems(Array.isArray(results[0])?results[0]:[]);
      setHaggles(Array.isArray(results[1])?results[1]:[]);
      setDeals(Array.isArray(results[2])?results[2]:[]);
      setAnns(Array.isArray(results[3])?results[3]:[]);
      setLoading(false);
    });
  }

  useEffect(function(){load();},[]);

  var filtered = items.filter(function(i){
    var mc = cat==="All" || i.category===cat;
    var mq = i.title && i.title.toLowerCase().indexOf(q.toLowerCase())>-1;
    return mc && mq && !i.sold;
  });

  function inCart(id){return cart.find(function(c){return c.id===id;});}
  function addToCart(item){if(!inCart(item.id))setCart(function(p){return p.concat([item]);});}
  function rm(id){setCart(function(p){return p.filter(function(c){return c.id!==id;});});}

  function submit(g) {
    return dbIns("orders",{
      order_ref:orderRef,buyer_name:form.name,buyer_email:form.email,buyer_phone:form.phone,
      delivery:form.delivery,address:form.address,payment:form.payment,note:form.note,
      items:cart.map(function(i){return {id:i.id,title:i.title,price:getPrice(i)};}),
      total:g
    }).then(function(){
      return Promise.all(cart.map(function(i){return dbUpd("items",i.id,{sold:true});}));
    }).then(function(){
      setGrand(g); setCart([]); setDone(true); load();
    });
  }

  var clothCats = CATS.filter(function(c){return CLOTH.indexOf(c)>-1;});
  var otherCats = CATS.filter(function(c){return c!=="All" && CLOTH.indexOf(c)===-1;});

  function tabBtn(c, label) {
    return <button key={c} onClick={function(){setCat(c);}} style={{background:"none",border:"none",borderBottom:cat===c?"2px solid #f0c060":"2px solid transparent",color:cat===c?"#f0c060":"#999",padding:"9px 10px",cursor:"pointer",fontSize:10,fontFamily:"inherit",textTransform:"uppercase",letterSpacing:0.5,whiteSpace:"nowrap"}}>{label||c}</button>;
  }

  if (admin) return <AdminPage items={items} haggles={haggles} deals={deals} anns={anns} onRefresh={load} onExit={function(){setAdmin(false);}}/>;
  if (done) return <ConfirmPage orderRef={orderRef} form={form} grand={grand}/>;
  if (view==="checkout") return <CheckoutPage form={form} setForm={setForm} cart={cart} deals={deals} onBack={function(){setView("cart");}} onSubmit={submit}/>;
  if (view==="cart") return <CartPage cart={cart} rm={rm} deals={deals} onBack={function(){setView("shop");}} onChk={function(){setView("checkout");}}/>;
  if (view==="haggle"&&hagItem) return <HagglePage item={hagItem} haggles={haggles} onRefresh={load} onBack={function(){setView("item");}} onAddToCart={function(i){addToCart(i);setView("shop");}}/>;
  if (view==="item"&&selItem) return <ItemPage item={selItem} inCart={!!inCart(selItem.id)} onAdd={function(){addToCart(selItem);}} onHaggle={function(){setHagItem(selItem);setView("haggle");}} onBack={function(){setView("shop");}} cartCount={cart.length} onCart={function(){setView("cart");}} deals={deals}/>;

  return (
    <div style={{minHeight:"100vh",background:"#faf7f2"}}>
      <div style={{background:"#2c2c2c",position:"sticky",top:0,zIndex:100,boxShadow:"0 2px 12px rgba(0,0,0,0.3)"}}>
        <div style={{maxWidth:1100,margin:"0 auto",padding:"12px 16px",display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:10}}>
          <div>
            <div style={{fontSize:20,fontWeight:"bold",color:"#f0c060",letterSpacing:1}}>Shady-Rae's</div>
            <div style={{fontSize:10,color:"#aaa",letterSpacing:3,textTransform:"uppercase"}}>Virtual Garage Sale</div>
          </div>
          <div style={{display:"flex",gap:8,alignItems:"center"}}>
            <input value={q} onChange={function(e){setQ(e.target.value);}} placeholder="Search..." style={{padding:"7px 14px",borderRadius:20,border:"1px solid #555",background:"#3a3a3a",color:"#fff",fontSize:13,width:120,outline:"none"}}/>
            <button onClick={function(){setView("cart");}} style={{background:"#f0c060",border:"none",borderRadius:20,padding:"8px 14px",cursor:"pointer",fontWeight:"bold",fontSize:13,color:"#2c2c2c",display:"flex",alignItems:"center",gap:5}}>
              Cart {cart.length > 0 && <span style={{background:"#e85",color:"#fff",borderRadius:"50%",width:17,height:17,display:"inline-flex",alignItems:"center",justifyContent:"center",fontSize:10}}>{cart.length}</span>}
            </button>
            <button onClick={function(){var p=prompt("Admin password:");if(p===PASS)setAdmin(true);}} style={{background:"none",border:"1px solid #555",borderRadius:20,padding:"7px 12px",cursor:"pointer",color:"#888",fontSize:12}}>Admin</button>
          </div>
        </div>
        <div style={{borderTop:"1px solid #3a3a3a",overflowX:"auto"}}>
          <div style={{display:"flex",padding:"0 12px",minWidth:"max-content",maxWidth:1100,margin:"0 auto",alignItems:"center"}}>
            {tabBtn("All","All")}
            <div style={{width:1,background:"#444",margin:"6px 6px",height:20}}/>
            <span style={{color:"#666",fontSize:9,padding:"0 4px",whiteSpace:"nowrap"}}>CLOTHING</span>
            {clothCats.map(function(c){return tabBtn(c,c.replace(" Clothing",""));})}
            <div style={{width:1,background:"#444",margin:"6px 6px",height:20}}/>
            {otherCats.map(function(c){return tabBtn(c,c);})}
          </div>
        </div>
      </div>

      <Ann anns={anns}/>

      <div style={{maxWidth:1100,margin:"0 auto",padding:"24px 14px"}}>
        {loading
          ? <div style={{textAlign:"center",padding:80,color:"#aaa"}}><div style={{fontSize:36,marginBottom:12}}>⏳</div><div>Loading...</div></div>
          : filtered.length === 0
            ? <div style={{textAlign:"center",padding:80,color:"#aaa"}}><div style={{fontSize:48}}>🏷️</div><div style={{marginTop:12,fontSize:16}}>No items found</div></div>
            : <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(190px,1fr))",gap:16}}>
                {filtered.map(function(it){
                  return (
                    <div key={it.id} onClick={function(){setSelItem(it);setView("item");}} style={{background:"#fff",borderRadius:12,overflow:"hidden",cursor:"pointer",boxShadow:"0 2px 8px rgba(0,0,0,0.08)",border:"1px solid #ede8e0"}}>
                      <div style={{position:"relative"}}>
                        <img src={it.image||"https://placehold.co/400x300?text=No+Image"} alt={it.title} style={{width:"100%",height:175,objectFit:"cover",display:"block"}}/>
                        <div style={{position:"absolute",top:7,right:7,background:"#2c2c2c",color:"#f0c060",fontSize:10,padding:"3px 8px",borderRadius:10}}>{it.condition}</div>
                        {inCart(it.id) && <div style={{position:"absolute",top:7,left:7,background:"#5a8a5a",color:"#fff",fontSize:10,padding:"3px 8px",borderRadius:10}}>In cart</div>}
                      </div>
                      <div style={{padding:"11px 13px"}}>
                        <div style={{fontSize:10,color:"#b89a5a",textTransform:"uppercase",letterSpacing:1,marginBottom:2}}>{it.category}</div>
                        <div style={{fontSize:13,fontWeight:"bold",color:"#2c2c2c",marginBottom:4,lineHeight:1.3}}>{it.title}</div>
                        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                          <div style={{fontSize:17,fontWeight:"bold",color:"#c0854a"}}>{fmt(it.price)}</div>
                          <div style={{fontSize:10,color:"#bbb"}}>Haggle ok</div>
                        </div>
                        <DealBadge deals={deals} id={it.id}/>
                      </div>
                    </div>
                  );
                })}
              </div>}
        <div style={{textAlign:"center",marginTop:40,color:"#ccc",fontSize:11,letterSpacing:1}}>Kelowna, BC — Pickup or shipped — All prices CAD</div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
