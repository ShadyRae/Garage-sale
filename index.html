async function uploadImage(file) {
  const ext = file.name.split(".").pop();
  const filename = `${Date.now()}-${Math.random().toString(36).substr(2,6)}.${ext}`;
  const res = await fetch(`${SUPABASE_URL}/storage/v1/object/${BUCKET}/${filename}`, {
    method:"POST",
    headers:{apikey:SUPABASE_KEY,Authorization:`Bearer ${SUPABASE_KEY}`,"Content-Type":file.type},
    body:file
  });
  if (!res.ok) throw new Error("Upload failed");
  return `${SUPABASE_URL}/storage/v1/object/public/${BUCKET}/${filename}`;
}

    setError(null);setUploading(true);
    setPreview(URL.createObjectURL(file));

function DealBadge({deals,itemId}){

  if(!deal) return null;
  const label = deal.deal_type==="bundle"?`🎁 Bundle deal`:
    deal.deal_type==="qty_price"?`🏷️ ${deal.quantity} for ${fmt(deal.price)}`:
    `🏷️ Buy ${deal.quantity} get 1 free`;
  return <div style={{background:"#e85",color:"#fff",fontSize:10,padding:"3px 8px",borderRadius:10,display:"inline-block",marginTop:4}}>{label}</div>;
}

// ─── CART DEAL CALC ───
function calcCartTotal(cart,deals){
  let total=0;
  const usedIds=new Set();
  // group by deal
  for(const deal of deals){
    if(!deal.active||!Array.isArray(deal.item_ids)) continue;
    const eligible=cart.filter(i=>deal.item_ids.includes(i.id)&&!usedIds.has(i.id));
    if(deal.deal_type==="qty_price"&&eligible.length>=deal.quantity){
      const groups=Math.floor(eligible.length/deal.quantity);
      const remainder=eligible.length%deal.quantity;
      total+=groups*deal.price;
      eligible.slice(eligible.length-remainder).forEach(i=>{total+=(i.hagglePrice??i.price);usedIds.add(i.id);});
      eligible.slice(0,groups*deal.quantity).forEach(i=>usedIds.add(i.id));
    } else if(deal.deal_type==="buy_get_free"&&eligible.length>=deal.quantity){
      const groups=Math.floor(eligible.length/(deal.quantity+1));
      const paying=eligible.length-groups;
      const sorted=[...eligible].sort((a,b)=>(a.hagglePrice??a.price)-(b.hagglePrice??b.price));
      sorted.slice(0,groups).forEach(i=>usedIds.add(i.id));
      sorted.slice(groups).forEach(i=>{total+=(i.hagglePrice??i.price);usedIds.add(i.id);});
    }
  }
  cart.filter(i=>!usedIds.has(i.id)).forEach(i=>total+=(i.hagglePrice??i.price));
  return total;
}

        <div style={{fontSize:13,color:"#888",margin:"8px 0"}}>You can still buy at {fmt(item.price)}.</div>
        <button onClick={onBack} style={{...btn("#2c2c2c","#f0c060"),marginTop:10}}>Go Back</button>
      </div>}
    </div>
  </div>;
}

    <div style={{background:"#2c2c2c",padding:"13px 18px",display:"flex",justifyContent:"space-between",alignItems:"center",position:"sticky",top:0,zIndex:100}}>

    </div>
    <div style={{maxWidth:800,margin:"0 auto",padding:"28px 18px"}}>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(280px,1fr))",gap:30}}>

        <div style={{display:"flex",flexDirection:"column",gap:14}}>

          <div style={{fontSize:24,fontWeight:"bold",color:"#2c2c2c",lineHeight:1.2}}>{item.title}</div>
          <div style={{fontSize:30,fontWeight:"bold",color:"#c0854a"}}>{fmt(item.price)}</div>
          {deal&&<div style={{background:"#fff3e0",border:"1px solid #e85",borderRadius:8,padding:"10px 14px"}}>
            <div style={{fontSize:13,fontWeight:"bold",color:"#e85"}}>🏷️ {deal.title}</div>
            <div style={{fontSize:12,color:"#888",marginTop:2}}>
              {deal.deal_type==="qty_price"?`Buy ${deal.quantity} qualifying items for ${fmt(deal.price)}`:

          <div style={{fontSize:14,color:"#555",lineHeight:1.7}}>{item.description}</div>
          <div style={{background:"#fffbe6",border:"1px solid #f0c060",borderRadius:8,padding:"10px 14px",fontSize:12,color:"#887020"}}>
            📦 Free pickup in Kelowna, BC · Shipping +${SHIPPING_COST} CAD
          </div>
          <div style={{display:"flex",flexDirection:"column",gap:10}}>
            {!inCart?<button onClick={onAddToCart} style={btn("#2c2c2c","#f0c060")}>Add to Cart 🛒</button>:
              <div style={{background:"#5a8a5a",color:"#fff",borderRadius:8,padding:"13px",textAlign:"center",fontSize:14}}>✓ Already in your cart!</div>}

// ─── ADMIN PANEL ───
function AdminPanel({items,haggles,deals,announcements,db,onRefresh,onExit}){
  const [tab,setTab]=useState("add");
  const [newItem,setNewItem]=useState({title:"",category:"Women's Clothing",price:"",condition:"Good",description:"",image:""});
  const [saving,setSaving]=useState(false);
  const [announcement,setAnnouncement]=useState(announcements[0]?.message||"");
  const [savingAnn,setSavingAnn]=useState(false);
  const [newDeal,setNewDeal]=useState({title:"",deal_type:"qty_price",quantity:3,price:"",item_ids:[]});
  const [savingDeal,setSavingDeal]=useState(false);
  const pending=haggles.filter(h=>h.status==="pending");

  const saveAnnouncement=async()=>{
    setSavingAnn(true);
    if(announcements.length>0){
      await db.update("announcements",announcements[0].id,{message:announcement,active:!!announcement});
    } else {
      await db.insert("announcements",{message:announcement,active:!!announcement});
    }
    await onRefresh();setSavingAnn(false);
  };

  const addItem=async()=>{
    if(!newItem.title||!newItem.price)return;
    setSaving(true);
    await db.insert("items",{...newItem,price:parseFloat(newItem.price),sold:false});
    setNewItem({title:"",category:"Women's Clothing",price:"",condition:"Good",description:"",image:""});
    await onRefresh();setSaving(false);setTab("items");
  };

  const saveDeal=async()=>{
    if(!newDeal.title||!newDeal.item_ids.length)return;
    setSavingDeal(true);
    await db.insert("deals",{...newDeal,price:newDeal.price?parseFloat(newDeal.price):null,active:true});
    setNewDeal({title:"",deal_type:"qty_price",quantity:3,price:"",item_ids:[]});
    await onRefresh();setSavingDeal(false);setTab("deals");
  };

  const toggleDealItem=(id)=>{
    setNewDeal(d=>({...d,item_ids:d.item_ids.includes(id)?d.item_ids.filter(x=>x!==id):[...d.item_ids,id]}));
  };

  const respondHaggle=async(h,accept)=>{
    await db.update("haggles",h.id,{status:accept?"accepted":"rejected"});
    if(accept)await db.update("items",h.item_id,{price:h.offer});
    await onRefresh();
  };

  const tabs=[["add","➕ Add Item"],["items",`📦 Items (${items.length})`],["deals",`🏷️ Deals (${deals.length})`],["haggles",`💬 Offers${pending.length?` (${pending.length})`:""}`],["announce","📢 Announce"]];

  return <div style={{minHeight:"100vh",background:"#1a1a1a",color:"#fff"}}>
    <div style={{background:"#111",padding:"13px 18px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
      <div style={{color:"#f0c060",fontWeight:"bold",fontSize:15}}>⚙️ Admin Panel</div>
      <button onClick={onExit} style={{background:"none",border:"1px solid #555",borderRadius:20,padding:"6px 14px",color:"#aaa",cursor:"pointer",fontSize:12}}>← Back to Shop</button>
    </div>
    <div style={{display:"flex",borderBottom:"1px solid #333",overflowX:"auto"}}>
      {tabs.map(([key,label])=>
        <button key={key} onClick={()=>setTab(key)} style={{background:"none",border:"none",borderBottom:tab===key?"2px solid #f0c060":"2px solid transparent",color:tab===key?"#f0c060":"#888",padding:"11px 14px",cursor:"pointer",fontSize:11,fontFamily:"inherit",whiteSpace:"nowrap"}}>{label}</button>
      )}
    </div>
    <div style={{maxWidth:900,margin:"0 auto",padding:20}}>

      {tab==="announce"&&<div style={{maxWidth:480}}>
        <div style={{fontSize:13,color:"#aaa",marginBottom:16}}>This shows as a banner at the top of your shop. Leave blank to hide it.</div>
        <Field label="Announcement message" dark>
          <textarea value={announcement} onChange={e=>setAnnouncement(e.target.value)} rows={3} placeholder="e.g. 🎉 New items added! Free local delivery this weekend only!"
            style={{...darkInp(),resize:"vertical",fontFamily:"inherit"}}/>
        </Field>
        <button onClick={saveAnnouncement} style={btn("#f0c060","#2c2c2c")}>
          {savingAnn?"Saving…":"💾 Save Announcement"}
        </button>
        {announcement&&<div style={{marginTop:16,background:"linear-gradient(135deg,#c0854a,#f0c060)",borderRadius:8,padding:"12px 16px"}}>
          <div style={{fontSize:12,color:"#2c2c2c",fontWeight:"bold",marginBottom:4}}>Preview:</div>
          <div style={{fontSize:13,color:"#2c2c2c"}}>📢 {announcement}</div>
        </div>}
      </div>}

      {tab==="add"&&<div style={{maxWidth:480}}>
        <Field label="Photo *" dark><ImageUploader dark onUploaded={url=>setNewItem(n=>({...n,image:url}))}/></Field>
        <Field label="Title *" dark><input value={newItem.title} onChange={e=>setNewItem(n=>({...n,title:e.target.value}))} style={darkInp()}/></Field>
        <Field label="Price (CAD) *" dark><input type="number" value={newItem.price} onChange={e=>setNewItem(n=>({...n,price:e.target.value}))} style={darkInp()}/></Field>
        <Field label="Category" dark>
          <select value={newItem.category} onChange={e=>setNewItem(n=>({...n,category:e.target.value}))} style={darkInp()}>
            {CATEGORIES.filter(c=>c!=="All").map(c=><option key={c}>{c}</option>)}
          </select>
        </Field>
        <Field label="Condition" dark>
          <select value={newItem.condition} onChange={e=>setNewItem(n=>({...n,condition:e.target.value}))} style={darkInp()}>
            {["Like New","Very Good","Good","Fair","Parts Only"].map(c=><option key={c}>{c}</option>)}
          </select>
        </Field>
        <Field label="Description" dark>
          <textarea value={newItem.description} onChange={e=>setNewItem(n=>({...n,description:e.target.value}))} rows={3} style={{...darkInp(),resize:"vertical",fontFamily:"inherit"}}/>
        </Field>
        <button onClick={addItem} disabled={!newItem.title||!newItem.price||saving} style={btn(newItem.title&&newItem.price?"#f0c060":"#555","#2c2c2c")}>
          {saving?"Saving…":"➕ Add Item to Shop"}
        </button>
      </div>}

      {tab==="items"&&<div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(180px,1fr))",gap:12}}>
        {items.map(item=><div key={item.id} style={{background:"#2c2c2c",borderRadius:10,overflow:"hidden",border:"1px solid #3a3a3a",opacity:item.sold?0.5:1}}>
          <img src={item.image||"https://placehold.co/200x130"} alt={item.title} style={{width:"100%",height:120,objectFit:"cover"}}/>
          <div style={{padding:10}}>
            <div style={{fontSize:12,fontWeight:"bold",color:"#fff",marginBottom:2}}>{item.title}</div>
            <div style={{fontSize:11,color:"#888",marginBottom:6}}>{item.category}</div>
            <div style={{fontSize:14,color:"#f0c060",marginBottom:8}}>{fmt(item.price)}{item.sold?" · SOLD":""}</div>
            <div style={{display:"flex",gap:5}}>
              <button onClick={async()=>{await db.update("items",item.id,{sold:!item.sold});onRefresh();}}
                style={{flex:1,background:item.sold?"#3a5a3a":"#5a3a3a",border:"none",borderRadius:5,padding:"6px",color:"#fff",cursor:"pointer",fontSize:10,fontFamily:"inherit"}}>
                {item.sold?"Unmark":"Mark Sold"}
              </button>
              <button onClick={async()=>{await db.delete("items",item.id);onRefresh();}}
                style={{background:"#3a2020",border:"none",borderRadius:5,padding:"6px 8px",color:"#e88",cursor:"pointer",fontSize:10}}>✕</button>
            </div>
          </div>
        </div>)}
      </div>}

      {tab==="deals"&&<div>
        <div style={{marginBottom:20}}>
          <div style={{fontSize:14,fontWeight:"bold",color:"#f0c060",marginBottom:12}}>Create New Deal</div>
          <div style={{maxWidth:480}}>
            <Field label="Deal name *" dark><input value={newDeal.title} onChange={e=>setNewDeal(d=>({...d,title:e.target.value}))} placeholder='e.g. "Women\'s Clothing — 3 for $8"' style={darkInp()}/></Field>
            <Field label="Deal type" dark>
              <select value={newDeal.deal_type} onChange={e=>setNewDeal(d=>({...d,deal_type:e.target.value}))} style={darkInp()}>
                <option value="qty_price">Buy X items for $Y</option>
                <option value="buy_get_free">Buy X get 1 free</option>
                <option value="bundle">Bundle (pre-grouped items)</option>
              </select>
            </Field>
            {newDeal.deal_type!=="bundle"&&<Field label={`Quantity needed (${newDeal.deal_type==="buy_get_free"?"items to buy":"items in group"})`} dark>
              <input type="number" value={newDeal.quantity} onChange={e=>setNewDeal(d=>({...d,quantity:parseInt(e.target.value)||2}))} style={darkInp()}/>
            </Field>}
            {newDeal.deal_type==="qty_price"&&<Field label="Group price ($)" dark>
              <input type="number" value={newDeal.price} onChange={e=>setNewDeal(d=>({...d,price:e.target.value}))} placeholder="e.g. 8.00" style={darkInp()}/>
            </Field>}
            {newDeal.deal_type==="bundle"&&<Field label="Bundle price ($)" dark>
              <input type="number" value={newDeal.price} onChange={e=>setNewDeal(d=>({...d,price:e.target.value}))} placeholder="e.g. 25.00" style={darkInp()}/>
            </Field>}
            <Field label={`Select items for this deal (${newDeal.item_ids.length} selected)`} dark>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6,maxHeight:300,overflowY:"auto"}}>
                {items.filter(i=>!i.sold).map(item=>{
                  const selected=newDeal.item_ids.includes(item.id);
                  return <div key={item.id} onClick={()=>toggleDealItem(item.id)}
                    style={{background:selected?"#3a5a3a":"#2c2c2c",border:`2px solid ${selected?"#5a8a5a":"#444"}`,borderRadius:8,padding:8,cursor:"pointer",display:"flex",gap:8,alignItems:"center"}}>
                    <img src={item.image||"https://placehold.co/40"} style={{width:36,height:36,objectFit:"cover",borderRadius:4,flexShrink:0}}/>
                    <div>
                      <div style={{fontSize:11,color:"#fff",fontWeight:"bold",lineHeight:1.2}}>{item.title}</div>
                      <div style={{fontSize:10,color:"#888"}}>{fmt(item.price)}</div>
                    </div>
                    {selected&&<div style={{marginLeft:"auto",color:"#5a8a5a",fontSize:16}}>✓</div>}
                  </div>;

            </Field>
            <button onClick={saveDeal} disabled={!newDeal.title||!newDeal.item_ids.length||savingDeal} style={btn(newDeal.title&&newDeal.item_ids.length?"#f0c060":"#555","#2c2c2c")}>
              {savingDeal?"Saving…":"💾 Save Deal"}
            </button>

        {deals.length>0&&<div>
          <div style={{fontSize:14,fontWeight:"bold",color:"#f0c060",marginBottom:12}}>Active Deals</div>
          {deals.map(deal=><div key={deal.id} style={{background:"#2c2c2c",borderRadius:10,padding:16,marginBottom:10,border:`1px solid ${deal.active?"#c0854a":"#444"}`}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:8}}>
              <div>
                <div style={{fontWeight:"bold",color:"#fff"}}>{deal.title}</div>
                <div style={{fontSize:12,color:"#aaa",marginTop:2}}>
                  {deal.deal_type==="qty_price"?`${deal.quantity} for ${fmt(deal.price)}`:
                   deal.deal_type==="buy_get_free"?`Buy ${deal.quantity} get 1 free`:
                   `Bundle — ${fmt(deal.price)}`} · {Array.isArray(deal.item_ids)?deal.item_ids.length:0} items
                </div>
              </div>
              <div style={{display:"flex",gap:6}}>
                <button onClick={async()=>{await db.update("deals",deal.id,{active:!deal.active});onRefresh();}}
                  style={{background:deal.active?"#5a3a3a":"#3a5a3a",border:"none",borderRadius:6,padding:"7px 12px",color:"#fff",cursor:"pointer",fontSize:11,fontFamily:"inherit"}}>
                  {deal.active?"Pause":"Activate"}
                </button>
                <button onClick={async()=>{await db.delete("deals",deal.id);onRefresh();}}
                  style={{background:"#3a2020",border:"none",borderRadius:6,padding:"7px 10px",color:"#e88",cursor:"pointer",fontSize:11}}>✕</button>
              </div>
            </div>
          </div>)}
        </div>}
      </div>}

      {tab==="haggles"&&<div>
        {haggles.length===0?<div style={{color:"#888",textAlign:"center",padding:40}}>No offers yet</div>:
          haggles.map(h=><div key={h.id} style={{background:"#2c2c2c",borderRadius:10,padding:18,marginBottom:10,border:`1px solid ${h.status==="pending"?"#f0c060":h.status==="accepted"?"#5a8a5a":"#444"}`}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",flexWrap:"wrap",gap:10}}>
              <div>
                <div style={{fontWeight:"bold",marginBottom:3}}>{h.item_title}</div>
                <div style={{fontSize:13,color:"#aaa"}}>Asking {fmt(h.asking_price)} · Offer: <strong style={{color:"#f0c060"}}>{fmt(h.offer)}</strong></div>
                <div style={{fontSize:11,color:"#888",marginTop:3}}>{h.buyer_name} · {h.buyer_email}</div>
              </div>
              {h.status==="pending"?<div style={{display:"flex",gap:8}}>
                <button onClick={()=>respondHaggle(h,true)} style={{background:"#3a6a3a",border:"none",borderRadius:6,padding:"8px 14px",color:"#fff",cursor:"pointer",fontFamily:"inherit"}}>✓ Accept</button>
                <button onClick={()=>respondHaggle(h,false)} style={{background:"#6a3a3a",border:"none",borderRadius:6,padding:"8px 14px",color:"#fff",cursor:"pointer",fontFamily:"inherit"}}>✕ Decline</button>
              </div>:
              <div style={{fontSize:12,padding:"4px 10px",borderRadius:20,background:h.status==="accepted"?"#3a6a3a":"#4a2020",color:"#fff"}}>{h.status}</div>}
            </div>
          </div>)
        }
      </div>}
    </div>
  </div>;
}

// ─── MAIN APP ───
function App(){
  const [items,setItems]=useState([]);
  const [haggles,setHaggles]=useState([]);
  const [deals,setDeals]=useState([]);
  const [announcements,setAnnouncements]=useState([]);
  const [loading,setLoading]=useState(true);
  const [cart,setCart]=useState([]);
  const [view,setView]=useState("shop");
  const [selectedItem,setSelectedItem]=useState(null);
  const [haggleItem,setHaggleItem]=useState(null);
  const [activeCategory,setActiveCategory]=useState("All");
  const [searchQuery,setSearchQuery]=useState("");
  const [adminMode,setAdminMode]=useState(false);
  const [checkoutForm,setCheckoutForm]=useState({name:"",email:"",phone:"",delivery:"pickup",address:"",payment:"etransfer",note:""});
  const [orderRef]=useState("GS-"+Math.random().toString(36).substr(2,6).toUpperCase());
  const [confirmed,setConfirmed]=useState(false);

  const loadData=async()=>{
    setLoading(true);
    const [a,b,c,d]=await Promise.all([db.get("items"),db.get("haggles"),db.get("deals"),db.get("announcements")]);
    setItems(Array.isArray(a)?a:[]);
    setHaggles(Array.isArray(b)?b:[]);
    setDeals(Array.isArray(c)?c:[]);
    setAnnouncements(Array.isArray(d)?d:[]);
    setLoading(false);
  };

  useEffect(()=>{loadData();},[]);

  const filtered=items.filter(i=>{
    const matchCat=activeCategory==="All"||i.category===activeCategory;
    const matchSearch=i.title?.toLowerCase().includes(searchQuery.toLowerCase())||i.description?.toLowerCase().includes(searchQuery.toLowerCase());
    return matchCat&&matchSearch&&!i.sold;
  });

  const cartTotal=calcCartTotal(cart,deals);
  const shipping=checkoutForm.delivery==="mail"?SHIPPING_COST:0;
  const grandTotal=cartTotal+shipping;
  const inCart=(id)=>cart.find(c=>c.id===id);
  const addToCart=(item)=>{if(!inCart(item.id))setCart(p=>[...p,item]);};
  const removeFromCart=(id)=>setCart(p=>p.filter(c=>c.id!==id));

  const submitOrder=async()=>{
    await db.insert("orders",{
      order_ref:orderRef,buyer_name:checkoutForm.name,buyer_email:checkoutForm.email,
      buyer_phone:checkoutForm.phone,delivery:checkoutForm.delivery,address:checkoutForm.address,
      payment:checkoutForm.payment,note:checkoutForm.note,
      items:cart.map(i=>({id:i.id,title:i.title,price:i.hagglePrice??i.price})),
      total:grandTotal
    });
    for(const item of cart)await db.update("items",item.id,{sold:true});
    setCart([]);setConfirmed(true);loadData();
  };

  if(adminMode)return <AdminPanel items={items} haggles={haggles} deals={deals} announcements={announcements} db={db} onRefresh={loadData} onExit={()=>setAdminMode(false)}/>;
  if(confirmed)return <Confirmation orderRef={orderRef} form={checkoutForm} grandTotal={grandTotal}/>;
  if(view==="checkout")return <Checkout form={checkoutForm} setForm={setCheckoutForm} cart={cart} deals={deals} shipping={shipping} grandTotal={grandTotal} onBack={()=>setView("cart")} onSubmit={submitOrder}/>;
  if(view==="cart")return <CartPage cart={cart} removeFromCart={removeFromCart} deals={deals} onBack={()=>setView("shop")} onCheckout={()=>setView("checkout")}/>;
  if(view==="haggle"&&haggleItem)return <HagglePage item={haggleItem} haggles={haggles} db={db} onRefresh={loadData} onBack={()=>setView("item")} onAddToCart={(item)=>{addToCart(item);setView("shop");}}/>;
  if(view==="item"&&selectedItem)return <ItemDetail item={selectedItem} inCart={!!inCart(selectedItem.id)} onAddToCart={()=>addToCart(selectedItem)} onHaggle={()=>{setHaggleItem(selectedItem);setView("haggle");}} onBack={()=>setView("shop")} cartCount={cart.length} onCartClick={()=>setView("cart")} deals={deals}/>;

  // category groups for header
  const clothingCats=CATEGORIES.filter(c=>CLOTHING_CATS.includes(c));
  const otherCats=CATEGORIES.filter(c=>c!=="All"&&!CLOTHING_CATS.includes(c));

  return <div style={{minHeight:"100vh",background:"#faf7f2"}}>
    <div style={{background:"#2c2c2c",position:"sticky",top:0,zIndex:100,boxShadow:"0 2px 12px rgba(0,0,0,0.3)"}}>
      <div style={{maxWidth:1100,margin:"0 auto",padding:"12px 16px",display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:10}}>
        <div>
          <div style={{fontSize:20,fontWeight:"bold",color:"#f0c060",letterSpacing:1}}>🏡 Shady-Rae's</div>
          <div style={{fontSize:10,color:"#aaa",letterSpacing:3,textTransform:"uppercase"}}>Virtual Garage Sale</div>
        </div>
        <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
          <input value={searchQuery} onChange={e=>setSearchQuery(e.target.value)} placeholder="Search…"
            style={{padding:"7px 14px",borderRadius:20,border:"1px solid #555",background:"#3a3a3a",color:"#fff",fontSize:13,width:130,outline:"none"}}/>
          <button onClick={()=>setView("cart")} style={{background:"#f0c060",border:"none",borderRadius:20,padding:"8px 14px",cursor:"pointer",fontWeight:"bold",fontSize:13,color:"#2c2c2c",display:"flex",alignItems:"center",gap:5}}>
            🛒{cart.length>0&&<span style={{background:"#e85",color:"#fff",borderRadius:"50%",width:17,height:17,display:"inline-flex",alignItems:"center",justifyContent:"center",fontSize:10}}>{cart.length}</span>}
          </button>
          <button onClick={()=>{const p=prompt("Admin password:");if(p===ADMIN_PASSWORD)setAdminMode(true);}}
            style={{background:"none",border:"1px solid #555",borderRadius:20,padding:"7px 12px",cursor:"pointer",color:"#888",fontSize:12}}>⚙️</button>
        </div>
      </div>
      <div style={{borderTop:"1px solid #3a3a3a",overflowX:"auto",maxWidth:1100,margin:"0 auto"}}>
        <div style={{display:"flex",padding:"0 16px",minWidth:"max-content"}}>
          <button onClick={()=>setActiveCategory("All")} style={{background:"none",border:"none",borderBottom:activeCategory==="All"?"2px solid #f0c060":"2px solid transparent",color:activeCategory==="All"?"#f0c060":"#999",padding:"9px 14px",cursor:"pointer",fontSize:11,fontFamily:"inherit",letterSpacing:0.5,textTransform:"uppercase",whiteSpace:"nowrap"}}>All</button>
          <div style={{width:1,background:"#444",margin:"8px 4px"}}/>
          <span style={{color:"#666",fontSize:10,padding:"10px 6px",alignSelf:"center",whiteSpace:"nowrap"}}>CLOTHING:</span>
          {clothingCats.map(cat=><button key={cat} onClick={()=>setActiveCategory(cat)} style={{background:"none",border:"none",borderBottom:activeCategory===cat?"2px solid #f0c060":"2px solid transparent",color:activeCategory===cat?"#f0c060":"#999",padding:"9px 12px",cursor:"pointer",fontSize:11,fontFamily:"inherit",letterSpacing:0.5,textTransform:"uppercase",whiteSpace:"nowrap"}}>{cat.replace(" Clothing","")}</button>)}
          <div style={{width:1,background:"#444",margin:"8px 4px"}}/>
          {otherCats.map(cat=><button key={cat} onClick={()=>setActiveCategory(cat)} style={{background:"none",border:"none",borderBottom:activeCategory===cat?"2px solid #f0c060":"2px solid transparent",color:activeCategory===cat?"#f0c060":"#999",padding:"9px 12px",cursor:"pointer",fontSize:11,fontFamily:"inherit",letterSpacing:0.5,textTransform:"uppercase",whiteSpace:"nowrap"}}>{cat}</button>)}
        </div>
      </div>
    </div>

    <AnnouncementBanner announcements={announcements}/>

    <div style={{maxWidth:1100,margin:"0 auto",padding:"24px 14px"}}>
      {loading?<div style={{textAlign:"center",padding:80,color:"#aaa"}}><div style={{fontSize:36,marginBottom:12}}>⏳</div>Loading…</div>:
      filtered.length===0?<div style={{textAlign:"center",padding:80,color:"#aaa"}}><div style={{fontSize:48}}>🏷️</div><div style={{marginTop:12,fontSize:16}}>No items found</div></div>:
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(200px,1fr))",gap:16}}>
        {filtered.map(item=>(
          <div key={item.id} onClick={()=>{setSelectedItem(item);setView("item");}}
            style={{background:"#fff",borderRadius:12,overflow:"hidden",cursor:"pointer",boxShadow:"0 2px 8px rgba(0,0,0,0.08)",border:"1px solid #ede8e0"}}>
            <div style={{position:"relative"}}>
              <img src={item.image||"https://placehold.co/400x300?text=No+Image"} alt={item.title} style={{width:"100%",height:180,objectFit:"cover",display:"block"}}/>
              <div style={{position:"absolute",top:7,right:7,background:"#2c2c2c",color:"#f0c060",fontSize:10,padding:"3px 8px",borderRadius:10}}>{item.condition}</div>
              {inCart(item.id)&&<div style={{position:"absolute",top:7,left:7,background:"#5a8a5a",color:"#fff",fontSize:10,padding:"3px 8px",borderRadius:10}}>In cart ✓</div>}
            </div>
            <div style={{padding:"11px 13px"}}>
              <div style={{fontSize:10,color:"#b89a5a",textTransform:"uppercase",letterSpacing:1,marginBottom:2}}>{item.category}</div>
              <div style={{fontSize:13,fontWeight:"bold",color:"#2c2c2c",marginBottom:4,lineHeight:1.3}}>{item.title}</div>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                <div style={{fontSize:17,fontWeight:"bold",color:"#c0854a"}}>{fmt(item.price)}</div>
                <div style={{fontSize:10,color:"#bbb"}}>💬 Haggle ok</div>
              </div>
              <DealBadge deals={deals} itemId={item.id}/>
            </div>
          </div>
        ))}
      </div>}
      <div style={{textAlign:"center",marginTop:40,color:"#ccc",fontSize:11,letterSpacing:1}}>
        Kelowna, BC · Local pickup or shipped · All prices CAD
      </div>
    </div>
  </div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
