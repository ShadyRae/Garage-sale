// DB
function dbGet(t) {
  return fetch(SB+"/rest/v1/"+t+"?order=created_at.desc",{headers:H}).then(function(r){return r.json();}).catch(function(){return [];});
}
function dbIns(t,d) {
  return fetch(SB+"/rest/v1/"+t,{method:"POST",headers:HJ,body:JSON.stringify(d)}).then(function(r){return r.json();});
}
function dbUpd(t,id,d) {
  return fetch(SB+"/rest/v1/"+t+"?id=eq."+id,{method:"PATCH",headers:HJ,body:JSON.stringify(d)}).then(function(r){return r.json();});
}
function dbDel(t,id) {
  return fetch(SB+"/rest/v1/"+t+"?id=eq."+id,{method:"DELETE",headers:H});
}
function uploadImg(file) {
  var ext = file.name.split(".").pop();
  var name = Date.now()+"-"+Math.random().toString(36).substr(2,5)+"."+ext;
  return fetch(SB+"/storage/v1/object/items/"+name,{
    method:"POST",
    headers:{apikey:KEY,Authorization:"Bearer "+KEY,"Content-Type":file.type},
    body:file
  }).then(function(r){
    if(!r.ok) throw new Error("Upload failed");
    return SB+"/storage/v1/object/public/items/"+name;
  });
}

function load() {
  setState({loading:true});
  return Promise.all([dbGet("items"),dbGet("haggles"),dbGet("deals"),dbGet("announcements")])
    .then(function(r){
      setState({
        items:Array.isArray(r[0])?r[0]:[],
        haggles:Array.isArray(r[1])?r[1]:[],
        deals:Array.isArray(r[2])?r[2]:[],
        anns:Array.isArray(r[3])?r[3]:[],
        loading:false
      });
    });
}

function fmt(n){return "$"+Number(n).toFixed(2);}
function gp(i){return i.hagglePrice!=null?i.hagglePrice:i.price;}

function calcTotal(cart,deals){
  var total=0, used={};
  deals.forEach(function(deal){
    if(!deal.active||!Array.isArray(deal.item_ids))return;
    var el=cart.filter(function(i){return deal.item_ids.indexOf(i.id)>-1&&!used[i.id];});
    if(deal.deal_type==="qty_price"&&el.length>=deal.quantity){
      var g=Math.floor(el.length/deal.quantity);
      total+=g*deal.price;
      el.slice(0,g*deal.quantity).forEach(function(i){used[i.id]=true;});
      el.slice(g*deal.quantity).forEach(function(i){total+=gp(i);used[i.id]=true;});
    } else if(deal.deal_type==="buy_get_free"&&el.length>=deal.quantity){
      var sorted=el.slice().sort(function(a,b){return gp(a)-gp(b);});
      var free=Math.floor(el.length/(deal.quantity+1));
      sorted.slice(0,free).forEach(function(i){used[i.id]=true;});
      sorted.slice(free).forEach(function(i){total+=gp(i);used[i.id]=true;});
    }
  });
  cart.forEach(function(i){if(!used[i.id])total+=gp(i);});
  return total;
}

// HTML HELPERS
function el(tag,attrs,children){
  var e=document.createElement(tag);
  if(attrs) Object.keys(attrs).forEach(function(k){
    if(k==="style"&&typeof attrs[k]==="object"){
      Object.keys(attrs[k]).forEach(function(s){e.style[s]=attrs[k][s];});
    } else if(k.startsWith("on")){
      e.addEventListener(k.slice(2).toLowerCase(),attrs[k]);
    } else if(k==="className"){
      e.className=attrs[k];
    } else {
      e.setAttribute(k,attrs[k]);
    }
  });
  if(children){
    (Array.isArray(children)?children:[children]).forEach(function(c){
      if(c==null||c===false)return;
      if(typeof c==="string"||typeof c==="number"){
        e.appendChild(document.createTextNode(c));
      } else {
        e.appendChild(c);
      }
    });
  }
  return e;
}

function div(style,children){return el("div",{style:style},children);}
function span(style,text){return el("span",{style:style},[text]);}
function txt(t){return document.createTextNode(t);}

function btn(label,bg,col,onclick,disabled){
  var b=el("button",{style:{width:"100%",background:disabled?"#bbb":bg,color:disabled?"#888":col,border:"none",borderRadius:"8px",padding:"13px",fontSize:"15px",fontWeight:"bold",cursor:disabled?"not-allowed":"pointer"},onClick:onclick||function(){}});
  b.textContent=label;
  if(disabled)b.disabled=true;
  return b;
}

function inp(val,placeholder,onchange,type){
  var i=el("input",{type:type||"text",style:{width:"100%",padding:"11px 13px",border:"2px solid #ede8e0",borderRadius:"8px",fontSize:"14px",outline:"none",boxSizing:"border-box",background:"#fff"}});
  i.value=val||"";
  i.placeholder=placeholder||"";
  i.addEventListener("input",function(){onchange(this.value);});
  return i;
}

function dinp(val,placeholder,onchange,type){
  var i=inp(val,placeholder,onchange,type);
  i.style.background="#3a3a3a";
  i.style.border="1px solid #555";
  i.style.color="#fff";
  return i;
}

function fld(label,child,dark){

    el("label",{style:{display:"block",fontSize:"12px",color:dark?"#aaa":"#888",marginBottom:"5px"}},[label]),

function sec(title,children){

// IMAGE UPLOADER
function makeImgUploader(onDone,dark){
  var wrap=div({});
  var fileInput=el("input",{type:"file",accept:"image/*",style:{display:"none"}});
  wrap.appendChild(fileInput);

  var previewImg=null;
  var uploadBtn=el("button",{style:{width:"100%",background:dark?"#3a3a3a":"#f5f0e8",border:"2px dashed "+(dark?"#666":"#c0a070"),borderRadius:"8px",padding:"22px 14px",cursor:"pointer",textAlign:"center",color:dark?"#f0c060":"#c0854a"}});

  uploadBtn.addEventListener("click",function(){fileInput.click();});
  wrap.appendChild(uploadBtn);

  fileInput.addEventListener("change",function(){
    var file=this.files[0];
    if(!file)return;
    uploadBtn.textContent="Uploading...";
    uploadImg(file).then(function(url){
      onDone(url);
      uploadBtn.innerHTML="<div style='font-size:11px;color:#5a8a5a;margin-bottom:4px'>✓ Photo uploaded!</div><div style='font-size:11px'>Tap to change</div>";
    }).catch(function(){
      uploadBtn.textContent="Upload failed. Tap to retry.";
    });
  });
  return wrap;
}

function makeDealBadge(deals,itemId){
  var d=deals.find(function(x){return x.active&&Array.isArray(x.item_ids)&&x.item_ids.indexOf(itemId)>-1;});
  if(!d)return null;
  var lbl=d.deal_type==="qty_price"?d.quantity+" for "+fmt(d.price):d.deal_type==="buy_get_free"?"Buy "+d.quantity+" get 1 free":"Bundle deal";
  var b=span({background:"#e85",color:"#fff",fontSize:"10px",padding:"3px 8px",borderRadius:"10px",display:"inline-block",marginTop:"4px"},"🏷️ "+lbl);
  return b;
}

  var pend=mine.find(function(h){return h.status==="pending";});

  if(acc){
    var accBox=div({background:"#edfaf0",border:"1px solid #5a8a5a",borderRadius:"10px",padding:"20px",textAlign:"center"});
    accBox.appendChild(div({fontSize:"32px",marginBottom:"8px"},["🎉"]));

    accBox.appendChild(div({fontSize:"14px",color:"#555",margin:"8px 0"},["New price: "+fmt(acc.offer)]));
    var addAccBtn=btn("Add to Cart at New Price","#3a6a3a","#fff",function(){
      var updated=Object.assign({},item,{hagglePrice:acc.offer});
      var newCart=state.cart.filter(function(c){return c.id!==item.id;}).concat([updated]);
      setState({cart:newCart,view:"shop"});
    });
    accBox.appendChild(addAccBtn);
    box.appendChild(accBox);

// CHECKOUT VIEW

  // Info
  var nameI=inp(f.name,"Full name",function(v){setF("name",v);});
  var emailI=inp(f.email,"you@email.com",function(v){setF("email",v);},"email");

    var row=el("label",{style:{display:"flex",alignItems:"center",gap:"10px",padding:"12px 14px",background:checked?"#fdf4e3":"#fff",border:"2px solid "+(checked?"#f0c060":"#ede8e0"),borderRadius:"8px",cursor:"pointer",marginBottom:"8px"}});

    r.addEventListener("change",function(){if(this.checked)onChange();});
    row.appendChild(r);
    var s=span({fontWeight:"bold",fontSize:"14px"},label);
    row.appendChild(s);
    return row;
  }

  var delRows=[
    radioRow("del","pickup","Local Pickup — Kelowna, BC",f.delivery==="pickup",function(){setF("delivery","pickup");}),
    radioRow("del","mail","Ship to me (+$"+SHIP+" CAD)",f.delivery==="mail",function(){setF("delivery","mail");})
  ];

    var addrI=inp(f.address,"Street, City, Province, Postal",function(v){setF("address",v);});

  // Payment
  var payRows=[
    radioRow("pay","etransfer","E-Transfer",f.payment==="etransfer",function(){setF("payment","etransfer");}),
    radioRow("pay","paypal","PayPal",f.payment==="paypal",function(){setF("payment","paypal");}),
    radioRow("pay","cash","Cash (pickup only)",f.payment==="cash",function(){setF("payment","cash");})
  ];

  // Notes
  var noteTA=el("textarea",{style:{width:"100%",padding:"11px 13px",border:"2px solid #ede8e0",borderRadius:"8px",fontSize:"14px",outline:"none",boxSizing:"border-box",resize:"vertical",minHeight:"80px"}});
  noteTA.value=f.note;
  noteTA.placeholder="Anything for the seller?";
  noteTA.addEventListener("input",function(){setF("note",this.value);});
  main.appendChild(sec("Notes",[noteTA]));

  // Summary
  var total=calcTotal(state.cart,state.deals);
  var ship=f.delivery==="mail"?SHIP:0;
  var grand=total+ship;
  var orig=state.cart.reduce(function(s,i){return s+gp(i);},0);
  var saved=orig-total;

  var sumBox=div({background:"#fff",borderRadius:"12px",padding:"18px",border:"1px solid #ede8e0",marginBottom:"18px"});
  state.cart.forEach(function(i){
    var r=div({display:"flex",justifyContent:"space-between",fontSize:"13px",color:"#555",marginBottom:"3px"});
    r.appendChild(span({},i.title));
    r.appendChild(span({},fmt(gp(i))));
    sumBox.appendChild(r);
  });
  var divider=div({borderTop:"1px solid #ede8e0",marginTop:"10px",paddingTop:"10px"});
  if(saved>0){
    var sr=div({display:"flex",justifyContent:"space-between",fontSize:"13px",color:"#5a8a5a",fontWeight:"bold",marginBottom:"3px"});
    sr.appendChild(span({},"Deal savings"));
    sr.appendChild(span({},"-"+fmt(saved)));
    divider.appendChild(sr);
  }
  var subR=div({display:"flex",justifyContent:"space-between",fontSize:"13px",color:"#555",marginBottom:"3px"});
  subR.appendChild(span({},"Subtotal"));subR.appendChild(span({},fmt(total)));
  divider.appendChild(subR);
  var shipR=div({display:"flex",justifyContent:"space-between",fontSize:"13px",color:"#555",marginBottom:"3px"});
  shipR.appendChild(span({},"Shipping"));shipR.appendChild(span({},ship>0?fmt(ship):"Free"));
  divider.appendChild(shipR);
  var totR=div({display:"flex",justifyContent:"space-between",fontWeight:"bold",fontSize:"16px",color:"#c0854a",marginTop:"8px"});
  totR.appendChild(span({},"Total"));totR.appendChild(span({},fmt(grand)));
  divider.appendChild(totR);
  sumBox.appendChild(divider);
  main.appendChild(sumBox);

  var ok=f.name&&f.email&&(f.delivery!=="mail"||f.address);
  main.appendChild(btn(
    ok?"Place Order — "+fmt(grand):"Fill in required fields first",
    ok?"#2c2c2c":"#ccc",
    ok?"#f0c060":"#888",
    function(){
      if(!ok)return;
      dbIns("orders",{
        order_ref:state.orderRef,buyer_name:f.name,buyer_email:f.email,buyer_phone:f.phone,
        delivery:f.delivery,address:f.address,payment:f.payment,note:f.note,
        items:state.cart.map(function(i){return {id:i.id,title:i.title,price:gp(i)};}),
        total:grand
      }).then(function(){
        return Promise.all(state.cart.map(function(i){return dbUpd("items",i.id,{sold:true});}));
      }).then(function(){
        setState({cart:[],done:true,grand:grand});
        load();
      });
    },
    !ok
  ));
  main.appendChild(div({fontSize:"11px",color:"#aaa",textAlign:"center",marginTop:"10px"},["No account needed."]));
  wrap.appendChild(main);
  return wrap;
}

    // Existing deals
    if(state.deals.length>0){
      main.appendChild(div({fontSize:"14px",fontWeight:"bold",color:"#f0c060",marginBottom:"12px"},["Your Deals"]));
      state.deals.forEach(function(d){
        var dcard=div({background:"#2c2c2c",borderRadius:"10px",padding:"16px",marginBottom:"10px",border:"1px solid "+(d.active?"#c0854a":"#444")});
        var drow=div({display:"flex",justifyContent:"space-between",flexWrap:"wrap",gap:"8px",alignItems:"center"});
        var dinfo=div({});
        dinfo.appendChild(div({fontWeight:"bold"},[d.title]));
        var dlbl=d.deal_type==="qty_price"?d.quantity+" for "+fmt(d.price):d.deal_type==="buy_get_free"?"Buy "+d.quantity+" get 1 free":"Bundle "+fmt(d.price||0);
        dinfo.appendChild(div({fontSize:"12px",color:"#aaa",marginTop:"2px"},[dlbl+" — "+(Array.isArray(d.item_ids)?d.item_ids.length:0)+" items"]));
        drow.appendChild(dinfo);
        var dbtnRow=div({display:"flex",gap:"6px"});
        var pauseBtn=el("button",{style:{background:d.active?"#5a3a3a":"#3a5a3a",border:"none",borderRadius:"6px",padding:"7px 12px",color:"#fff",cursor:"pointer",fontSize:"11px"},onClick:function(){
          dbUpd("deals",d.id,{active:!d.active}).then(function(){load();});
        }});
        pauseBtn.textContent=d.active?"Pause":"Activate";
        dbtnRow.appendChild(pauseBtn);
        var delDBtn=el("button",{style:{background:"#3a2020",border:"none",borderRadius:"6px",padding:"7px 10px",color:"#e88",cursor:"pointer",fontSize:"11px"},onClick:function(){
          dbDel("deals",d.id).then(function(){load();});
        }});
        delDBtn.textContent="Del";
        dbtnRow.appendChild(delDBtn);
        drow.appendChild(dbtnRow);
        dcard.appendChild(drow);
        main.appendChild(dcard);
      });
    }
  }

  if(tab==="haggles"){
    if(state.haggles.length===0){
      main.appendChild(div({color:"#888",textAlign:"center",padding:"40px"},["No offers yet"]));
    } else {
      state.haggles.forEach(function(h){
        var hcard=div({background:"#2c2c2c",borderRadius:"10px",padding:"18px",marginBottom:"10px",border:"1px solid "+(h.status==="pending"?"#f0c060":h.status==="accepted"?"#5a8a5a":"#444")});
        var hrow=div({display:"flex",justifyContent:"space-between",flexWrap:"wrap",gap:"10px",alignItems:"flex-start"});
        var hinfo=div({});
        hinfo.appendChild(div({fontWeight:"bold",marginBottom:"3px"},[h.item_title]));
        hinfo.appendChild(div({fontSize:"13px",color:"#aaa"},["Asking "+fmt(h.asking_price)+" — Offer: "+fmt(h.offer)]));
        hinfo.appendChild(div({fontSize:"11px",color:"#888",marginTop:"3px"},[h.buyer_name+" — "+h.buyer_email]));
        hrow.appendChild(hinfo);
        if(h.status==="pending"){
          var hbtns=div({display:"flex",gap:"8px"});
          var accBtn=el("button",{style:{background:"#3a6a3a",border:"none",borderRadius:"6px",padding:"8px 14px",color:"#fff",cursor:"pointer"},onClick:function(){
            dbUpd("haggles",h.id,{status:"accepted"}).then(function(){
              return dbUpd("items",h.item_id,{price:h.offer});
            }).then(function(){load();});
          }});
          accBtn.textContent="Accept";
          var decBtn=el("button",{style:{background:"#6a3a3a",border:"none",borderRadius:"6px",padding:"8px 14px",color:"#fff",cursor:"pointer"},onClick:function(){
            dbUpd("haggles",h.id,{status:"rejected"}).then(function(){load();});
          }});
          decBtn.textContent="Decline";
          hbtns.appendChild(accBtn);
          hbtns.appendChild(decBtn);
          hrow.appendChild(hbtns);
        } else {
          var statusBadge=span({fontSize:"12px",padding:"4px 10px",borderRadius:"20px",background:h.status==="accepted"?"#3a6a3a":"#4a2020",color:"#fff"},h.status);
          hrow.appendChild(statusBadge);
        }
        hcard.appendChild(hrow);
        main.appendChild(hcard);
      });
    }
  }

  wrap.appendChild(main);
  return wrap;
}

// RENDER
function render(){
  var root=document.getElementById("root");
  root.innerHTML="";
  var view;
  if(state.admin) view=renderAdmin();
  else if(state.done) view=renderDone();
  else if(state.view==="checkout") view=renderCheckout();
  else if(state.view==="cart") view=renderCart();
  else if(state.view==="haggle") view=renderHaggle();
  else if(state.view==="item") view=renderItem();
  else view=renderShop();
  root.appendChild(view);
  // Scroll to top on view change
  window.scrollTo(0,0);
}

// INIT
load();
</script>
</body>
</html>
